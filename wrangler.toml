# Sacred Temple API — Cloudflare Workers + D1 + R2 (plano gratuito)
# 1) npm install && npx wrangler login
# 2) npm run db:create  → cole database_id abaixo
# 3) npm run db:migrate
# 4) npx wrangler r2 bucket create sacred-temple-media
# 5) descomente [[r2_buckets]] abaixo
# 6) npm run deploy

name = "sacred-temple-api"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Descomente e preencha após: npm run db:create
# [[d1_databases]]
# binding = "DB"
# database_name = "sacred-temple-db"
# database_id = "COLE_AQUI_O_ID"

# Descomente após: npx wrangler r2 bucket create sacred-temple-media
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "sacred-temple-media"

[vars]
APP_NAME = "Sacred Temple"

# Web Push (chave privada em Secret: VAPID_PRIVATE_KEY)
VAPID_PUBLIC_KEY = "BDeb9CNdEW3N_7IOJTBwLlBtKZIKPrTbxsAKEAu6S-yWILCNQQVCSAzmtoLDwOqcPs3nZ_bC_lAw9vTaltwiOH8"
